name: Build desktop installers

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            arch: arm64
            script: package:dev:mac:arm64
            installer: bisheng-mac-arm64.dmg
          - target: mac-x64
            runner: macos-15-intel
            arch: x64
            script: package:dev:mac:x64
            installer: bisheng-mac-x64.dmg
          - target: windows-x64
            runner: windows-2022
            arch: x64
            script: package:dev:win
            installer: bisheng-windows-x64-setup.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run typecheck
      - run: npm run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && secrets.DESKTOP_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && secrets.DESKTOP_CSC_KEY_PASSWORD || '' }}
          CSC_FOR_PULL_REQUEST: ${{ runner.os == 'macOS' && github.event_name == 'pull_request' && 'true' || 'false' }}
      - name: Verify app signature inside the macOS installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          INSTALLER: dist-dev/${{ matrix.installer }}
        run: |
          mount_point="$(mktemp -d)"
          hdiutil attach "$INSTALLER" -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" >/dev/null' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount_point/BISHENG.app"
      - name: Prepare development update metadata
        id: updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: node scripts/prepare-development-update-assets.mjs ${{ matrix.target }}
      - name: Upload development installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.installer }}
          path: dist-dev/${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 1
          archive: false
          overwrite: true
      - name: Upload development update metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.updates.outputs.metadata }}
          path: dist-dev/${{ steps.updates.outputs.metadata }}
          if-no-files-found: error
          retention-days: 1
          archive: false
          overwrite: true
