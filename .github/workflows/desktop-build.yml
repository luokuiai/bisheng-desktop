name: Build desktop installers

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            arch: arm64
            script: package:dev:mac:arm64
            installer: dist-dev/bisheng-dev-mac-arm64.dmg
          - target: mac-x64
            runner: macos-15-intel
            arch: x64
            script: package:dev:mac:x64
            installer: dist-dev/bisheng-dev-mac-x64.dmg
          - target: windows-x64
            runner: windows-2022
            arch: x64
            script: package:dev:win
            installer: dist-dev/bisheng-dev-windows-x64-setup.exe
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run typecheck
      - run: npm run ${{ matrix.script }}
      - name: Upload development installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: bisheng-dev-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
