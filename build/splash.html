<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LUOKUI-AI</title>
    <script>
      const splashTheme = new URLSearchParams(location.search).get('theme')
      document.documentElement.dataset.theme = splashTheme === 'dark' ? 'dark' : 'light'
      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.documentElement.dataset.platform = 'windows'
      }
    </script>
    <style>
      :root { color-scheme: light dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #17181a; background: #f7f7f7; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        padding: 32px;
        text-align: center;
      }
      html[data-platform="windows"] main { padding-top: 70px; }
      .mark { width: 56px; height: 56px; object-fit: contain; margin-bottom: 4px; opacity: .75; }
      .title { margin: 0; font-size: 23px; font-weight: 650; letter-spacing: -0.02em; }
      .status { margin: -4px 0 0; color: #777a80; font-size: 13px; }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      :root[data-theme='dark'] body {
        color: #f3f4f6;
        background: #121212;
      }
      :root[data-theme='dark'] .status {
        color: #9ca0a8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) body { color: #f3f4f6; background: #121212; }
        :root:not([data-theme]) .status { color: #9ca0a8; }
      }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <img class="mark" src="icon.png" alt="" />
      <h1 class="title" id="title">Starting LUOKUI-AI</h1>
      <p class="status" id="status">First launch may take a moment.</p>
    </main>
    <script>
      const query = new URLSearchParams(location.search)
      const requestedLocale = query.get('locale')
      const locale = requestedLocale === 'zh' || requestedLocale === 'en'
        ? requestedLocale
        : navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en'
      document.documentElement.lang = locale === 'zh' ? 'zh-CN' : 'en'
      if (locale === 'zh') {
        document.getElementById('title').textContent = '正在启动 LUOKUI-AI'
        document.getElementById('status').textContent = '首次启动可能需要一点时间。'
      }
      if (query.get('stage') === 'keychain') {
        document.getElementById('status').textContent = locale === 'zh'
          ? '正在恢复企业登录状态。如果 macOS 请求访问钥匙串，请在系统对话框中选择是否允许。'
          : 'Restoring your enterprise sign-in. If macOS requests Keychain access, choose whether to allow it in the system dialog.'
      }
    </script>
  </body>
</html>
